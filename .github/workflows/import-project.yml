name: Import project archive
on:
  push:
    branches: [main]
    paths:
      - 'bootstrap/*.zip'
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract project
        run: |
          archive=$(find bootstrap -maxdepth 1 -type f -name '*.zip' | head -n 1)
          test -n "$archive"
          rm -rf /tmp/project
          mkdir -p /tmp/project
          unzip -q "$archive" -d /tmp/project
          top=$(find /tmp/project -mindepth 1 -maxdepth 1 -type d | head -n 1)
          test -n "$top"
          rsync -a --delete --exclude='.git' "$top"/ ./
          rm -rf bootstrap
          rm -f .github/workflows/import-project.yml
      - name: Commit imported source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Import cleaned project source"
          git push
