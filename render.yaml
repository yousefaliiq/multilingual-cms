services:
  - type: web
    name: multilingual-cms
    runtime: node
    plan: free
    region: frankfurt
    branch: main
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: SESSION_SECRET
        sync: false
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: SUPABASE_CMS_FUNCTION_URL
        sync: false
      - key: SUPABASE_CMS_TOKEN
        sync: false
      - key: SUPABASE_UPLOAD_FUNCTION_URL
        sync: false
      - key: SUPABASE_UPLOAD_TOKEN
        sync: false
